name: Test MyZubster MVP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      
      - name: Start Flask server
        run: |
          # Trova e avvia il server (verifica se esiste)
          if [ -f src/api/server.py ]; then
            python src/api/server.py &
          elif [ -f server.py ]; then
            python server.py &
          else
            echo "Cerca il server Flask..."
            ls -la *.py src/**/*.py
          fi
          sleep 5
      
      - name: Run tests
        run: |
          python -m pytest test_observation_e2e.py test_api.py test_full.py test_get.py test_obs2.py -v
      
      - name: Verify Python syntax
        run: |
          python -m py_compile persistence_helper.py
          python -m py_compile src/api/server.py src/core/observation.py
          python -m py_compile test_observation_e2e.py
          python -m py_compile test_api.py
          python -m py_compile test_full.py
          python -m py_compile test_get.py
          python -m py_compile test_obs2.py
      - name: Build and verify Docker image
        run: |
          docker build --tag myzubster-mvp:test .
          docker run --detach --name myzubster-docker-test --publish 5001:5000 myzubster-mvp:test
          trap 'docker rm --force myzubster-docker-test' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5001/api/observations > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs myzubster-docker-test
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --request POST http://127.0.0.1:5001/api/observation \
            --header 'Content-Type: application/json' \
            --data '{"description":"CI Docker","latitude":44.0678,"longitude":12.5695}'
          curl --fail --silent http://127.0.0.1:5001/api/observations | grep 'CI Docker'
