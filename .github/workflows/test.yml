name: Test MyZubster MVP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      
      - name: Start Flask server
        run: |
          # Trova e avvia il server (verifica se esiste)
          if [ -f src/api/server.py ]; then
            python src/api/server.py &
          elif [ -f server.py ]; then
            python server.py &
          else
            echo "Cerca il server Flask..."
            ls -la *.py src/**/*.py
          fi
          sleep 5
      
      - name: Run tests
        run: |
          python -m pytest test_api.py test_full.py test_get.py test_obs2.py -v
      
      - name: Verify Python syntax
        run: |
          python -m py_compile persistence_helper.py
          python -m py_compile test_api.py
          python -m py_compile test_full.py
          python -m py_compile test_get.py
          python -m py_compile test_obs2.py
