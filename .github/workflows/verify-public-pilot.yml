name: Verify public Nicola Comics pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docs/nicola-comics/**"
      - "scripts/verify_public_pilot.py"
      - ".github/workflows/verify-public-pilot.yml"

jobs:
  verify-public-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Wait for Render auto-deploy
        run: sleep 45

      - name: Verify public pilot
        env:
          NICOLA_COMICS_BASE_URL: https://myzubster-mvp.onrender.com
          NICOLA_COMICS_TEST_TIMEOUT: "45"
        run: python scripts/verify_public_pilot.py
